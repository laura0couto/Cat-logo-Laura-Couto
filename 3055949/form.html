<!DOCTYPE html>
<html>
<head>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="form-wrapper">

    <h2 id="titulo">Cadastrar</h2>

    <form id="meuForm">

      <p class="label">Nome cidade</p>
      <input type="text" id="tituloCidade" placeholder="coloque o nome da cidade">

      <p class="label">Texto cidade</p>
      <input type="text" id="textoCidade" placeholder="texto sobre a cidade">

      <p class="label">Imagens</p>
      <input type="url" id="imagem" placeholder="URL da imagem">

      <p class="label">Nome imagem</p>
      <input type="text" id="nomeImagem" placeholder="nome da imagem">

      <p class="label">Dicas</p>
      <input type="text" id="textoDicas" placeholder="texto com dicas">

      <input type="submit" value="Enviar">

      <button type="button" onClick="alterarFundo()">
        adicionar
      </button>

    </form>

  </div>

  <div id="colecao"></div>

  <script src="sl3.js"></script>

</body>
</html>
