
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>CATÁLOGO - Cadastro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-wrapper">

        <h2 id="titulo">Cadastrar</h2>

        <form id="meuForm">

            <p class="label">Nome cidade</p>
            <input type="text" id="tituloCidade" placeholder="coloque o nome da cidade" required>

            <p class="label">Texto cidade</p>
            <input type="text" id="textoCidade" placeholder="texto sobre a cidade" required>

            <p class="label">Imagens</p>
            <input type="url" id="imagem" placeholder="URL da imagem" required>

            <p class="label">Nome imagem</p>
            <input type="text" id="nomeImagem" placeholder="nome da imagem" required>

            <p class="label">Dicas</p>
            <input type="text" id="textoDicas" placeholder="texto com dicas" required>

            <input type="submit" value="Enviar">

            <!-- ALTERAÇÃO: o botão também envia o formulário.
                 Antes, chamava uma função que não existia. -->
            <button type="submit">
                adicionar
            </button>

        </form>

    </div>

    <div id="colecao"></div>

    <!-- ALTERAÇÃO: carrega primeiro a classe DicasV. -->
    <script src="script.js"></script>

    <!-- ALTERAÇÃO: carrega o JavaScript do formulário depois da classe. -->
    <script src="sl3.js"></script>

</body>
</html>
